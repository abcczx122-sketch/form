<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body>
    <section class="login">
   <div class="wrapper">
    <div class="form-box logins ">
           <h2>Login</h2>
        <form action="#" id="form">

            <div class="input-box">
                <span class="icon"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" name="Email"  id="email">
                <label>Email</label>
                <span class="span"></span>
                
            </div>
               <div class="input-box">
                <span class="icon"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password"   id="password">
                <label>Password</label>
                 <span class="span"></span>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox">Remember Me</label>
                <a href="#" >Forgot Password</a>
            </div>
            <button class="btn" type="submit">Login</button>
            <div class="login-register">
                <p >Dont have account?  <a href="#" class="btnRegister">Register</a></p>

            </div>

        </form>
    </div>
    <div class="form-box Registers">
           <h2>Register</h2>
        <form action="#" id="froms">
  <div class="input-box">
                <span class="icon"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="Email"  id="UserName">
                <label>User Name</label>
                <span class="span"></span>
            </div>
            <div class="input-box">
                <span class="icon"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" name="Email" id="emails">
                <label>Email</label>
                <span class="span"></span>
            </div>
               <div class="input-box">
                <span class="icon"><i class="fa-solid fa-lock"></i></span>

                <input type="password" name="password"   id="passwords">

                <label>Password</label>
                <span class="span"></span>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox">Remember Me</label>
                <a href="#" >I agree to the trems & condition</a>
            </div>
            <button class="btns  " type="submit">Register</button>
            <div class="login-register">
                <p >Dont have account?  <a href="#" class="btnlogin">login</a></p>

            </div>

        </form>
    </div>
</div> 
    </section>
    <script src="main.js"></script>

</body>
</html>
